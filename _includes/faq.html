<section class="section faq" id="preguntas">
  <h2>Preguntas sobre la asesoría online</h2>
  <div class="faq-list">
    {%- for item in site.data.faq.items %}
    <details>
      <summary>{{ item.q | escape }}</summary>
      <p>{{ item.a | escape }}</p>
    </details>
    {%- endfor %}
  </div>
</section>
