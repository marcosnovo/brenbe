{% assign contact_email = site.data.contacto.email | default: '' | strip %}
<section class="contact" id="contacto">
  <div>
    <h2>Hablemos de tu espacio.</h2>
    {% if contact_email == '' %}<p>Estamos preparando el canal de consultas.</p>{% endif %}
  </div>
  {% if contact_email != '' %}
  <a class="button" href="mailto:{{ contact_email | escape }}">Escribile a Brenda</a>
  {% endif %}
</section>
