# Temas (hubs) de contenido: un pilar + varias guías que lo rodean. NO se edita desde el panel de Brenda.
#
# Cada guía se asigna a un tema con `hub: <id>` y `role: pilar | cluster` en su front matter (ver docs/growth/plantillas.md).
# La página del tema (p. ej. /guias/depto-chico/) se GENERA SOLA (_plugins/brenbe.rb) en cada idioma que tenga al menos
# `min_guides` guías publicadas de ese tema (publicada = misma regla que el sitemap: ready, idioma activo, index_when).
# Con menos, la página no existe: nada de páginas finas. Al publicar la guía que falta, aparece sola.
#
# Por idioma: slug (último tramo de la URL; no puede coincidir con el nombre de una guía), nombre (corto: menús, migas,
# "Más en este tema"), titulo (H1), seo_title (≤ 60 caracteres), descripcion (≤ 155), intro (párrafo de la página).
# `servicio`: ref del servicio con el que cierra el tema.
min_guides: 2
