items:
  - q: "What should I have ready for the first consultation?"
    a: "Photos of the room from several angles, approximate measurements and a list of what you want to change or keep. Inspiration images of colors or furniture you like help too, and so does a rough budget range."
  - q: "Can I refresh a room without renovating?"
    a: "Yes. We can work with the layout, paint, lighting, textiles and furniture. The starting point is how you use the space and what you want to improve. It also works well for renters."
  - q: "Do I have to buy new furniture?"
    a: "No. We can start from what you already own and decide which pieces to keep, rearrange or complement."
  - q: "How does an online consultation work if I live in the US?"
    a: "The consultation takes place by video call from Argentina, in English or Spanish. Argentina is on UTC-3 all year, so we pick a call time that is comfortable in your time zone, and photos, measurements and notes can be shared in writing whenever suits you."
  - q: "Are you a licensed interior designer?"
    a: "BRENBE offers decorating and design consultations: color, furniture, lighting and styling. It does not include construction, permits or structural advice. If your project requires a licensed professional where you live, I will tell you up front."
  - q: "Can you work with my budget?"
    a: "Yes. We work by priority: first what changes daily life in the room the most, then the details. If you have a budget range, share it and the recommendations will be built around it."
  - q: "Do you speak Spanish too?"
    a: "Yes. I work in English and in Spanish, so you can choose whichever language you are more comfortable discussing your home in."
