# Datos técnicos y poco frecuentes. NO se editan desde el panel de Brenda:
# se cambian solo desde GitHub. Todo es opcional; lo vacío no se publica.
apellido:
cargo:
formacion:
anio_inicio:
telefono:
# Mensaje que se completa al abrir WhatsApp desde la portada (vacío = mensaje por defecto).
whatsapp_mensaje:
pinterest:
linkedin:
facebook:
behance:
# Frase sobre plazos, por ejemplo: "Reunión de 60 minutos y propuesta en 7 días".
duracion:
# Medición y verificación (vacío = no se publica nada).
# Token de Cloudflare Web Analytics (solo el valor del token).
cloudflare_analytics_token:
# Código de Search Console (solo el valor de content="...").
google_site_verification:
# Código de verificación del dominio en Pinterest (solo el valor de content="..."). Vacío = no se publica.
pinterest_domain_verify:
# Clics a WhatsApp: con true (por defecto) los botones pasan por /wa/<página>/ y cuentan como visita en Cloudflare Web Analytics
# (solo si hay WhatsApp en "Mis datos"). Poné false para que abran WhatsApp directo, sin medir.
wa_track: true

# Formulario de contacto (ver docs/formulario-contacto.md). Con true se muestra el formulario en las páginas de contacto
# y estas pasan a indexarse. Activar SOLO cuando el Worker `brenbe-contacto` esté desplegado y con sus secretos.
contact_form: true
# Clave PÚBLICA del widget Turnstile (la secreta va como secreto TURNSTILE_SECRET del Worker). Vacío = sin Turnstile
# (el Worker se protege con honeypot + tiempo mínimo + límite por IP).
turnstile_sitekey: "0x4AAAAAAGOhlYDBuKKjcZSO"
