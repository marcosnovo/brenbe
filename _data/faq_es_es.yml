items:
  - q: "¿Qué conviene tener para la primera consulta?"
    a: "Prepara fotos de la habitación desde varios ángulos, medidas aproximadas y una lista de lo que quieres cambiar o conservar. Si tienes referencias de colores o muebles que te gustan, también sirven."
  - q: "¿Puedo renovar una habitación sin hacer obras?"
    a: "Sí. Podemos trabajar con la distribución, la pintura, la iluminación, los textiles y el mobiliario. El punto de partida es cómo usas el espacio y qué quieres mejorar."
  - q: "¿Tengo que comprar muebles nuevos?"
    a: "Podemos partir de lo que ya tienes y decidir qué piezas conviene conservar, recolocar o complementar."
  - q: "¿Cómo funciona si vivo en España?"
    a: "El asesoramiento es online, por videollamada y por escrito. Coordinamos el horario de la videollamada según tu zona, en una hora que te venga bien."
  - q: "¿Puedo hacerlo si vivo de alquiler?"
    a: "Sí. Se trabaja con soluciones reversibles, como textiles, alfombras, lámparas, muebles y objetos. Si quieres pintar o cambiar algo fijo, conviene consultarlo antes con quien te alquila."
