items:
  - q: "¿Qué conviene tener para la primera consulta?"
    a: "Prepará fotos del ambiente desde varios ángulos, medidas aproximadas y una lista de lo que querés cambiar o conservar. Si tenés referencias de colores o muebles que te gustan, también sirven."
  - q: "¿Puedo renovar un ambiente sin hacer obra?"
    a: "Sí. Podemos trabajar con la distribución, la pintura, la iluminación, los textiles y el mobiliario. El punto de partida es cómo usás el espacio y qué querés mejorar."
  - q: "¿Tengo que comprar muebles nuevos?"
    a: "Podemos partir de lo que ya tenés y decidir qué piezas conviene conservar, redistribuir o complementar."
  - q: "¿Cómo funciona si vivo en otro país?"
    a: "La asesoría es 100 % online, por videollamada y por escrito, y funciona para cualquier lugar. Contame en qué país estás y qué espacio querés trabajar, así podemos definir un alcance que tenga sentido para vos."
