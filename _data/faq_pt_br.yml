items:
  - q: "O que é bom ter à mão para a primeira consulta?"
    a: "Prepare fotos do ambiente de vários ângulos, medidas aproximadas e uma lista do que você quer mudar ou manter. Se tiver referências de cores ou móveis de que gosta, também ajudam."
  - q: "Dá para renovar um ambiente sem fazer obra?"
    a: "Sim. Podemos trabalhar com a distribuição, a pintura, a iluminação, os têxteis e os móveis. O ponto de partida é como você usa o espaço e o que quer melhorar, inclusive se você mora de aluguel."
  - q: "Preciso comprar móveis novos?"
    a: "Não necessariamente. Podemos partir do que você já tem e decidir quais peças vale manter, mudar de lugar ou complementar."
  - q: "Como funciona o atendimento a partir da Argentina?"
    a: "A consultoria é feita à distância, por videochamada e em português, a partir da Argentina. Você me conta em que cidade está e qual espaço quer trabalhar, e combinamos um escopo e um horário que façam sentido para você."
  - q: "A Brenda vende os móveis ou faz a obra?"
    a: "Não. A consultoria indica o que escolher e como combinar, mas as compras e a execução ficam com você e com quem você preferir. Não inclui obra, reforma nem acompanhamento de obra."
