collections:
  proyectos:
    output: true
    permalink: /proyectos/:name/
  guias:
    output: true
    permalink: /guias/:name/
defaults:
  - scope:
      path: ""
      type: guias
    values:
      layout: guia
  - scope:
      path: ""
      type: proyectos
    values:
      layout: proyecto
  - scope:
      path: ""
    values:
      lang: es-AR

title: BRENBE Interiorismo
description: "Asesorías de interiorismo y decoración desde Argentina: renová tu casa sin obra, presencial u online."
url: "https://brenbe.com"
lang: es-AR
timezone: America/Argentina/Buenos_Aires

# Fotos subidas desde el panel (/media/...): Cloudflare las achica y convierte a WebP/AVIF al vuelo.
# Requiere activar "Transformations" para brenbe.com en el panel de Cloudflare (Images > Transformations).
# Si no está activado, el sitio vuelve solo a la foto original (más lento). Poné false para desactivarlo.
image_transforms: true
# Activar solo cuando Images > Transformations esté habilitado en Cloudflare: og:image no tiene fallback.
social_image_transforms: false

# Cloudflare Pages reads these from the build output; Jekyll skips "_" files by default.
include:
  - _headers

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .pages.yml
  - .ruby-version
  - .gitignore
  - vendor
  - node_modules
  - .bundle
  - .jekyll-cache
